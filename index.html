<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초등 2학년 수학 문장제 돋보기 - 시각과 시간</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts: Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ==========================================
    // 1. 기본 정적 문제 데이터 (초등 2학년 2학기 시각과 시간)
    // ==========================================
    const DEFAULT_PROBLEMS = [
      {
        id: 'p1',
        title: '민우의 영화 관람 시간',
        grade: '초등학교 2학년',
        unit: '시각과 시간',
        topic: '시각과 시간 계산하기',
        difficulty: '보통',
        context: '민우는 가족들과 함께 영화관에서 애니메이션 영화를 보았습니다.',
        question: '영화가 시작한 시각은 2시 10분이고, 영화가 끝난 시각은 3시 40분입니다. 영화가 상영된 시간은 몇 시간 몇 분일까요?',
        importantInfo: ['시작 시각: 2시 10분', '끝난 시각: 3시 40분', '구하는 것: 상영된 시간(시간의 길이)'],
        expressionOptions: [
          '3시 40분 - 2시 10분 = 1시간 30분',
          '2시 10분 + 3시 40분 = 5시 50분',
          '3시 - 2시 = 1시간'
        ],
        correctExpressionIndex: 0,
        answerValue: '1시간 30분',
        explanation: '영화가 끝난 시각(3시 40분)에서 시작한 시각(2시 10분)을 뺍니다. 시는 시끼리(3 - 2 = 1시간), 분은 분끼리(40 - 10 = 30분) 계산하면 총 1시간 30분이 됩니다.',
        hints: [
          '💡 1단계: 걸린 시간을 구할 때는 [끝난 시각]에서 [시작한 시각]을 뺍니다.',
          '💡 2단계: "시는 시끼리", "분은 분끼리" 나누어서 계산해 보세요.',
          '💡 3단계: 3시에서 2시를 빼면 1시간, 40분에서 10분을 빼면 30분입니다.'
        ],
        teacherNote: '학생들이 시각(point in time)과 시간(duration)의 차이를 구별할 수 있도록 지도해 주세요.'
      },
      {
        id: 'p2',
        title: '지유의 도서관 공부 시간',
        grade: '초등학교 2학년',
        unit: '시각과 시간',
        topic: '몇 시간 후의 시각 구하기',
        difficulty: '쉬움',
        context: '지유는 오후 1시 15분에 도서관에 도착하여 책을 읽기 시작했습니다.',
        question: '지유가 도서관에서 2시간 동안 책을 읽었다면, 도서관에서 나온 시각은 오후 몇 시 몇 분일까요?',
        importantInfo: ['도착 시각: 오후 1시 15분', '읽은 시간: 2시간 동안', '구하는 것: 책을 다 읽은 후의 시각'],
        expressionOptions: [
          '오후 1시 15분 + 2시간 = 오후 3시 15분',
          '오후 1시 15분 - 2시간 = 11시 15분',
          '2시간 + 15분 = 2시 15분'
        ],
        correctExpressionIndex: 0,
        answerValue: '오후 3시 15분',
        explanation: '도착한 시각(오후 1시 15분)에 읽은 시간(2시간)을 더해 줍니다. 분은 그대로 15분이고, 1시에 2시간을 더하면 3시가 되므로 정답은 오후 3시 15분입니다.',
        hints: [
          '💡 1단계: 시간이 지난 후의 시각을 구할 때는 시작 시각에 지나간 시간을 더합니다.',
          '💡 2단계: "시간"은 "시" 부분에만 더하고 "분" 부분은 그대로 두세요.',
          '💡 3단계: 1시에 2를 더하면 몇 시가 될까요?'
        ],
        teacherNote: '시각에 시간을 더할 때 "분"이 변하지 않는 점을 강조하세요.'
      },
      {
        id: 'p3',
        title: '준서의 버스 기다리기',
        grade: '초등학교 2학년',
        unit: '시각과 시간',
        topic: '몇 분 전의 시각 구하기',
        difficulty: '어려움',
        context: '준서네 동네에 버스가 도착하는 시각은 오전 10시 30분입니다.',
        question: '준서는 버스가 오기 25분 전에 정류장에 미리 도착했습니다. 준서가 버스 정류장에 도착한 시각은 오전 몇 시 몇 분일까요?',
        importantInfo: ['버스도착 시각: 오전 10시 30분', '미리 도착한 시간: 25분 전', '구하는 것: 준서가 도착한 시각'],
        expressionOptions: [
          '오전 10시 30분 - 25분 = 오전 10시 5분',
          '오전 10시 30분 + 25분 = 오전 10시 55분',
          '30분 - 25분 = 5분'
        ],
        correctExpressionIndex: 0,
        answerValue: '오전 10시 5분',
        explanation: '어떤 시각의 "전" 시각을 구할 때는 빼기를 해야 합니다. 10시 30분에서 25분을 빼면, 시는 그대로 10시이고 30분 - 25분 = 5분이 되므로 오전 10시 5분입니다.',
        hints: [
          '💡 1단계: "~분 전"의 시각을 구할 때는 주어진 시각에서 그 만큼의 시간을 빼줍니다.',
          '💡 2단계: 30분에서 25분을 빼면 몇 분이 남는지 생각해 보세요.',
          '💡 3단계: 10시는 그대로 유지되고 30분 - 25분 = 5분입니다.'
        ],
        teacherNote: '시간을 더하거나 뺄 때 "~전"과 "~후"의 개념을 상기시켜 줍니다.'
      }
    ];

    function App() {
      // 모드 및 상태 관리
      const [problems, setProblems] = useState(DEFAULT_PROBLEMS);
      const [currentProblemIdx, setCurrentProblemIdx] = useState(0);
      const [currentStep, setCurrentStep] = useState(1); // 1: 읽기, 2: 조건 찾기, 3: 식 세우기, 4: 정답 & 풀이
      
      // UI 컨트롤 상태
      const [viewMode, setViewMode] = useState('solve'); // 'solve' | 'create' | 'ai'
      const [isProjectorMode, setIsProjectorMode] = useState(false); // 큰 글자 프로젝터 모드
      const [revealedHintCount, setRevealedHintCount] = useState(0);
      const [selectedExpression, setSelectedExpression] = useState(null);
      const [userFoundInfo, setUserFoundInfo] = useState([]);

      // AI 문제 생성 관련 상태
      const [aiDifficulty, setAiDifficulty] = useState('보통');
      const [aiLoading, setAiLoading] = useState(false);
      const [aiError, setAiError] = useState('');

      // 교사 새 문제 작성 폼 상태
      const [newProblem, setNewProblem] = useState({
        title: '',
        context: '',
        question: '',
        info1: '',
        info2: '',
        info3: '',
        exp1: '',
        exp2: '',
        exp3: '',
        correctIdx: 0,
        answerValue: '',
        explanation: '',
        hint1: '',
        hint2: '',
        hint3: '',
        teacherNote: ''
      });

      const currentProblem = problems[currentProblemIdx] || problems[0];

      // 문제 변경 시 단계 초기화
      useEffect(() => {
        setCurrentStep(1);
        setRevealedHintCount(0);
        setSelectedExpression(null);
        setUserFoundInfo([]);
      }, [currentProblemIdx]);

      // 키보드 단축키 지원 (프로젝터/수업용)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (viewMode !== 'solve') return;
          if (e.key === 'ArrowRight' || e.key === 'PageDown') {
            if (currentStep < 4) setCurrentStep((prev) => prev + 1);
          } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            if (currentStep > 1) setCurrentStep((prev) => prev - 1);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [currentStep, viewMode]);

      // 조건 찾기 토글
      const toggleInfoFound = (index) => {
        if (userFoundInfo.includes(index)) {
          setUserFoundInfo(userFoundInfo.filter((i) => i !== index));
        } else {
          setUserFoundInfo([...userFoundInfo, index]);
        }
      };

      // 힌트 하나씩 열기
      const handleRevealNextHint = () => {
        if (revealedHintCount < currentProblem.hints.length) {
          setRevealedHintCount((prev) => prev + 1);
        }
      };

      // 교사 문제 직접 추가
      const handleCreateProblemSubmit = (e) => {
        e.preventDefault();
        if (!newProblem.title || !newProblem.context || !newProblem.question || !newProblem.answerValue) {
          alert('필수 입력 항목(제목, 상황, 질문, 정답)을 작성해 주세요.');
          return;
        }

        const created = {
          id: `custom_${Date.now()}`,
          title: newProblem.title,
          grade: '초등학교 2학년',
          unit: '시각과 시간',
          topic: '교사 직접 작성 문제',
          difficulty: '보통',
          context: newProblem.context,
          question: newProblem.question,
          importantInfo: [newProblem.info1, newProblem.info2, newProblem.info3].filter(Boolean),
          expressionOptions: [newProblem.exp1, newProblem.exp2, newProblem.exp3].filter(Boolean),
          correctExpressionIndex: parseInt(newProblem.correctIdx, 10),
          answerValue: newProblem.answerValue,
          explanation: newProblem.explanation,
          hints: [newProblem.hint1, newProblem.hint2, newProblem.hint3].filter(Boolean),
          teacherNote: newProblem.teacherNote
        };

        setProblems([...problems, created]);
        setCurrentProblemIdx(problems.length);
        setViewMode('solve');
        
        // 폼 초기화
        setNewProblem({
          title: '', context: '', question: '', info1: '', info2: '', info3: '',
          exp1: '', exp2: '', exp3: '', correctIdx: 0, answerValue: '', explanation: '',
          hint1: '', hint2: '', hint3: '', teacherNote: ''
        });
      };

      // Gemini API를 이용한 AI 문제 생성
      const handleGenerateAiProblem = async () => {
        setAiLoading(true);
        setAiError('');
        const apiKey = ""; // 런타임 환경 주입
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        const prompt = `초등학교 2학년 2학기 「시각과 시간」 단원에 맞는 새로운 실생활 문장제 문제를 1개 만들어 줘.
난이도: ${aiDifficulty}

반드시 아래 JSON 구조로만 답변하고 다른 텍스트는 포함하지 마.
{
  "title": "문제 제목 (예: 민아의 약속 시간)",
  "context": "초등 2학년 수준의 짧고 쉬운 일상 생활 배경 설명 (1~2문장)",
  "question": "구하고자 하는 핵심 질문 문장",
  "importantInfo": ["조건 1", "조건 2", "구할 것"],
  "expressionOptions": ["올바른 식 1개", "잘못된 오답 식 1개", "또 다른 오답 식 1개"],
  "correctExpressionIndex": 0,
  "answerValue": "최종 정답 (예: 2시간 15분 또는 오후 4시 20분)",
  "explanation": "초등학교 2학년 눈높이에 맞춘 친절하고 명확한 풀이 설명",
  "hints": ["💡 1단계 힌트", "💡 2단계 힌트", "💡 3단계 힌트"],
  "teacherNote": "교사를 위한 지도 팁"
}`;

        const payload = {
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: {
            responseMimeType: "application/json"
          }
        };

        try {
          let response;
          let delay = 1000;
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              if (response.ok) break;
            } catch (err) {
              if (attempt === 2) throw err;
            }
            await new Promise((res) => setTimeout(res, delay));
            delay *= 2;
          }

          if (!response || !response.ok) {
            throw new Error('AI 문제 생성 서비스에 연결할 수 없습니다.');
          }

          const result = await response.json();
          const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawText) throw new Error('올바른 응답을 받지 못했습니다.');

          const parsed = JSON.parse(rawText);
          const aiProblem = {
            id: `ai_${Date.now()}`,
            title: parsed.title || 'AI 생성 문제',
            grade: '초등학교 2학년',
            unit: '시각과 시간',
            topic: 'AI 자동 생성 문제',
            difficulty: aiDifficulty,
            context: parsed.context,
            question: parsed.question,
            importantInfo: parsed.importantInfo || [],
            expressionOptions: parsed.expressionOptions || [],
            correctExpressionIndex: parsed.correctExpressionIndex || 0,
            answerValue: parsed.answerValue,
            explanation: parsed.explanation,
            hints: parsed.hints || [],
            teacherNote: parsed.teacherNote || ''
          };

          setProblems([...problems, aiProblem]);
          setCurrentProblemIdx(problems.length);
          setViewMode('solve');
        } catch (err) {
          console.error(err);
          setAiError(err.message || '문제 생성 중 오류가 발생했습니다.');
        } finally {
          setAiLoading(false);
        }
      };

      return (
        <div className={`min-h-screen transition-colors duration-200 ${isProjectorMode ? 'bg-black text-white' : 'bg-slate-50 text-slate-800'}`}>
          
          {/* ================= GNB / 상단 헤더 ================= */}
          <header className={`border-b ${isProjectorMode ? 'bg-slate-900 border-slate-700' : 'bg-white border-slate-200 shadow-sm'} sticky top-0 z-30 px-4 py-3`}>
            <div className="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
              
              <div className="flex items-center space-x-3">
                <div className="bg-indigo-600 text-white p-2 rounded-xl flex items-center justify-center font-bold text-lg shadow-sm">
                  ⏰
                </div>
                <div>
                  <h1 className={`font-bold leading-tight ${isProjectorMode ? 'text-xl text-yellow-300' : 'text-lg text-slate-900'}`}>
                    초등 2학년 수학 문장제 돋보기
                  </h1>
                  <p className="text-xs opacity-75">시각과 시간 단원 · 단계별 풀이 길잡이</p>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <button
                  onClick={() => setIsProjectorMode(!isProjectorMode)}
                  className={`px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg border transition ${
                    isProjectorMode 
                      ? 'bg-yellow-400 text-slate-900 border-yellow-300 hover:bg-yellow-300' 
                      : 'bg-slate-100 text-slate-700 border-slate-300 hover:bg-slate-200'
                  }`}
                  title="교실 프로젝터용 고대비 및 대형 글자 모드"
                >
                  📺 {isProjectorMode ? '일반 화면' : '프로젝터 모드'}
                </button>

                <button
                  onClick={() => setViewMode('solve')}
                  className={`px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg transition ${
                    viewMode === 'solve' 
                      ? 'bg-indigo-600 text-white' 
                      : isProjectorMode ? 'bg-slate-800 text-slate-300' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  📖 문제 풀기
                </button>

                <button
                  onClick={() => setViewMode('create')}
                  className={`px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg transition ${
                    viewMode === 'create' 
                      ? 'bg-indigo-600 text-white' 
                      : isProjectorMode ? 'bg-slate-800 text-slate-300' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  ✍️ 문제 만들기
                </button>

                <button
                  onClick={() => setViewMode('ai')}
                  className={`px-3 py-1.5 text-xs sm:text-sm font-semibold rounded-lg transition ${
                    viewMode === 'ai' 
                      ? 'bg-indigo-600 text-white' 
                      : isProjectorMode ? 'bg-slate-800 text-slate-300' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  🤖 AI 새 문제
                </button>
              </div>
            </div>
          </header>

          {/* ================= 메인 컨텐츠 영역 ================= */}
          <main className="max-w-5xl mx-auto px-4 py-6">
            
            {/* ================= [VIEW 1] 문제 풀이 모드 ================= */}
            {viewMode === 'solve' && (
              <div>
                <div className={`p-4 rounded-2xl mb-6 flex flex-wrap items-center justify-between gap-4 border ${
                  isProjectorMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'
                }`}>
                  <div className="flex items-center space-x-3">
                    <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-700">
                      문제 {currentProblemIdx + 1} / {problems.length}
                    </span>
                    <span className={`text-xs px-2 py-1 rounded-md border ${
                      isProjectorMode ? 'border-slate-700 text-slate-300' : 'border-slate-200 text-slate-600'
                    }`}>
                      난이도: {currentProblem.difficulty}
                    </span>
                    <h2 className="font-semibold text-sm sm:text-base hidden sm:block">
                      {currentProblem.title}
                    </h2>
                  </div>

                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => setCurrentProblemIdx((prev) => Math.max(0, prev - 1))}
                      disabled={currentProblemIdx === 0}
                      className="px-3 py-1 text-sm font-bold rounded-lg border border-slate-300 disabled:opacity-30 hover:bg-slate-100 active:scale-95 transition"
                    >
                      ◀ 이전 문제
                    </button>
                    <select
                      value={currentProblemIdx}
                      onChange={(e) => setCurrentProblemIdx(Number(e.target.value))}
                      className={`text-sm rounded-lg border p-1.5 font-medium ${
                        isProjectorMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-800'
                      }`}
                    >
                      {problems.map((p, idx) => (
                        <option key={p.id} value={idx}>
                          {idx + 1}. {p.title}
                        </option>
                      ))}
                    </select>
                    <button
                      onClick={() => setCurrentProblemIdx((prev) => Math.min(problems.length - 1, prev + 1))}
                      disabled={currentProblemIdx === problems.length - 1}

            {/* ================= [VIEW 3] AI 생성 모드 ================= */}
            {viewMode === 'ai' && (
              <div className={`p-6 sm:p-8 rounded-3xl border ${isProjectorMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-xl'}`}>
                <h2 className="text-2xl font-bold mb-2">🤖 AI 맞춤형 새 문제 만들기</h2>
                <p className="text-sm opacity-75 mb-6">
                  Gemini AI를 이용하여 초등 2학년 시각과 시간 단원의 새로운 문제를 즉석에서 생성합니다.
                </p>

                <div className="space-y-6 max-w-lg">
                  <div>
                    <label className="block text-sm font-bold mb-2">원하는 난이도를 선택하세요</label>
                    <div className="grid grid-cols-3 gap-3">
                      {['쉬움', '보통', '어려움'].map((diff) => (
                        <button
                          key={diff}
                          type="button"
                          onClick={() => setAiDifficulty(diff)}
                          className={`p-3 rounded-xl border-2 font-bold text-center transition ${
                            aiDifficulty === diff
                              ? 'bg-indigo-600 text-white border-indigo-600'
                              : isProjectorMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200 text-slate-700'
                          }`}
                        >
                          {diff}
                        </button>
                      ))}
                    </div>
                  </div>

                  {aiError && (
                    <div className="p-4 rounded-xl bg-rose-50 text-rose-700 border border-rose-200 text-sm font-medium">
                      ⚠️ {aiError}
                    </div>
                  )}

                  <button
                    onClick={handleGenerateAiProblem}
                    disabled={aiLoading}
                    className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-bold rounded-2xl text-lg shadow-lg active:scale-95 transition flex items-center justify-center space-x-2"
                  >
                    {aiLoading ? (
                      <React.Fragment>
                        <svg className="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24" fill="none">
                          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span>새 문제 만드는 중...</span>
                      </React.Fragment>
                    ) : (
                      <span>✨ AI 문제 생성 시작하기</span>
                    )}
                  </button>
                </div>
              </div>
            )}

          </main>

          <footer className={`py-4 px-4 text-center text-xs opacity-60 border-t ${isProjectorMode ? 'border-slate-800' : 'border-slate-200'}`}>
            🔒 본 웹 앱은 로그인, 쿠키, 학생 개인정보 및 답안 저장을 일체 수행하지 않습니다.
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
